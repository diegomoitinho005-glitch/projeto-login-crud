<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Vida+ | Sistema de Agendamentos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- TELA DE LOGIN / CADASTRO -->
    <section id="auth-section" class="card">
      <div class="clinic-brand">Clínica Vida+</div>
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Entrar</button>
        <button id="tab-register" class="tab" type="button">Cadastrar Equipe</button>
      </div>

      <h2 id="auth-title">Acesso ao Sistema</h2>
      <p class="hint">Usuário: <strong>admin</strong> (ou <strong>recepcao</strong>) | Senha: <strong>1234</strong></p>

      <form id="auth-form">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" placeholder="Digite seu usuário" required />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha" required />
        </div>
        <button type="submit" id="auth-submit-btn" class="btn primary">Entrar</button>
      </form>

      <p id="auth-message" class="message"></p>
    </section>

    <!-- PAINEL CRUD DA CLÍNICA -->
    <section id="crud-section" class="card hidden">
      <header class="topbar">
        <div>
          <h2>Agenda de Consultas — Clínica Vida+</h2>
          <span class="user-badge">Atendente logado: <strong id="logged-user"></strong></span>
        </div>
        <button id="logout-btn" class="btn danger" type="button">Sair</button>
      </header>

      <form id="consulta-form" class="crud-form">
        <input type="hidden" id="consulta-id" />

        <div class="form-grid">
          <div class="form-group">
            <label for="paciente">Nome do Paciente</label>
            <input type="text" id="paciente" placeholder="Ex: Carlos Eduardo" required />
          </div>

          <div class="form-group">
            <label for="contato">Telefone / CPF</label>
            <input type="text" id="contato" placeholder="Ex: (75) 99999-0000" required />
          </div>

          <div class="form-group">
            <label for="medico">Médico / Especialidade</label>
            <input type="text" id="medico" placeholder="Ex: Dra. Helena - Pediatria" required />
          </div>

          <div class="form-group">
            <label for="data-hora">Data e Hora</label>
            <input type="datetime-local" id="data-hora" required />
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" required>
              <option value="Agendada">Agendada</option>
              <option value="Confirmada">Confirmada</option>
              <option value="Concluída">Concluída</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-btn" class="btn primary">Agendar Consulta</button>
          <button type="button" id="cancel-edit-btn" class="btn secondary hidden">Cancelar Edição</button>
        </div>
      </form>

      <div class="search-bar">
        <input type="text" id="busca-input" placeholder="Filtrar por nome do paciente ou médico..." />
      </div>

      <p id="crud-message" class="message"></p>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Contato</th>
              <th>Médico / Especialidade</th>
              <th>Data e Hora</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="consultas-list"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
